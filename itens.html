<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itens Perdidos & Encontrados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col">
                <h2>Itens Perdidos & Encontrados</h2>
            </div>
            <div class="col text-end d-flex justify-content-end align-items-center">
                <div style="width: 40px; height: 40px; border-radius: 50%; background-color: #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 10px;">
                    👤
                </div>
                <span id="nome-usuario">Carregando...</span>
                <button id="btn-logout" class="btn btn-sm btn-outline-danger ms-3">Sair</button>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <a href="item-cadastro.html" class="btn btn-primary">+ Novo Item</a>
            </div>
        </div>

        <div class="mb-3">
            <label for="pesquisa" class="form-label">Buscar Item:</label>
            <input type="text" id="pesquisa" class="form-control" placeholder="Digite o nome do item...">
        </div>

        <div class="mb-3">
            <label for="filtro" class="form-label">Filtrar por Categoria:</label>
            <select id="filtro" class="form-select">
                <option value="Todos">Todos</option>
                <option value="Chaves">Chaves</option>
                <option value="Celular">Celular</option>
                <option value="Carteira">Carteira</option>
                <option value="Mochila">Mochila</option>
            </select>
        </div>

        <div class="row" id="grid-itens">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/item-list.js"></script>
</body>
</html>
