<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Item - Achados e Perdidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="itens.html">Achados & Perdidos</a>
            <div class="navbar-nav">
                <a class="nav-link" href="itens.html">Ver Itens</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <h2>Cadastro de Item</h2>
                
                <div id="mensagem-alerta" class="alert d-none" role="alert"></div>

                <form id="form-cadastro-item">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Item:</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria:</label>
                        <select id="categoria" class="form-select" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Chaves">Chaves</option>
                            <option value="Celular">Celular</option>
                            <option value="Carteira">Carteira</option>
                            <option value="Mochila">Mochila</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição do Item:</label>
                        <textarea id="descricao" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="localizacao" class="form-label">Localização:</label>
                        <input type="text" id="localizacao" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status:</label>
                        <select id="status" class="form-select" required>
                            <option value="Perdido">Perdido</option>
                            <option value="Encontrado">Encontrado</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="contato" class="form-label">Contato:</label>
                        <input type="text" id="contato" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="imagem_url" class="form-label">Imagem do Item:</label>
                        <input type="file" id="imagem_url" class="form-control" accept="image/*" required>
                        <div class="form-text">Selecione uma imagem do item.</div>
                    </div>

                    <button type="submit" class="btn btn-primary">Cadastrar Item</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/item-cadastro.js"></script>
</body>
</html>
